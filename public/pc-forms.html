    .doc-page.legacy { display: block; padding: 15mm 18mm 12mm 28mm !important; line-height: 1.2; }

    .legacy .editable { outline: none; min-width: 30mm; display: inline-block; border-bottom: 1px dotted #888; padding: 0 4px; }

    .legacy .sign-line { margin-bottom: 1mm; }

<nav class="navbar navbar-expand-lg navbar-dark no-print">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-mortarboard-fill me-2"></i>ตะกั่วทุ่งงานทวีวิทยาคม</a>
    <div id="userBadge" class="d-flex align-items-center"></div>

</nav>

<div class="controls no-print">
  <div class="container">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label small fw-600 mb-1">เลือกแบบฟอร์ม</label>
        <select id="selForm" class="form-select form-select-sm" onchange="render()">
          <option value="pc1">ปค.1 — บันทึกการกระทำผิดของนักเรียน</option>
          <option value="pc3">ปค.3 — บันทึกการทำทัณฑ์บนนักเรียน</option>
          <option value="pc4">ปค.4 — ตัดคะแนนความประพฤติ</option>
          <option value="pc5">ปค.5 — บันทึกพฤติกรรมรายบุคคล</option>
          <option value="pc7">ปค.7 — หนังสือเชิญผู้ปกครอง (พฤติกรรม)</option>
          <option value="leave">ใบขออนุญาตออกนอกบริเวณโรงเรียน</option>
        </select>
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-600 mb-1">เลือกนักเรียน</label>
        <select id="selStudent" class="form-select form-select-sm" onchange="loadStudent()">
          <option value="">-- เลือกนักเรียน --</option>
        </select>
      </div>
      <div class="col-md-3" id="logPickWrap" style="display:none;">
        <label class="form-label small fw-600 mb-1">เลือกรายการที่จะออกใบ (ปค.4)</label>
        <select id="selLog" class="form-select form-select-sm" onchange="render()">
          <option value="">-- ทั้งหมด/ล่าสุด --</option>
        </select>
      </div>
      <div class="col-md-2 d-flex gap-1">
        <button class="btn btn-primary btn-sm flex-fill" onclick="saveForm()" id="saveBtn" disabled title="บันทึกลงระบบ">

        </button>

        ช่องสีเหลืองแก้ไขได้ • <b>บันทึก</b> = เก็บลงระบบเอามาแก้ทีหลังได้

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const THAI_MONTHS_F = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
let theme = {};
let curData = null;   // { student, logs, score, start_score }
let curFormId = null; // id ของฟอร์มที่กำลังแก้ (null = ฟอร์มใหม่)
let savedModal = null;

document.addEventListener('DOMContentLoaded', async () => {
  await loadCurrentUser();
  try { theme = await (await fetch('/api/public/theme')).json(); } catch(e){}
  await loadStudentList();
});

async function loadStudentList() {
  try {
    const students = await apiFetch('/api/students');
    const sel = document.getElementById('selStudent');
    const grouped = {};
    students.forEach(s => {
      const k = `ม.${s.class_level}/${s.room}`;
      (grouped[k] = grouped[k] || []).push(s);
    });
    Object.keys(grouped).sort().forEach(k => {
      const og = document.createElement('optgroup'); og.label = k;
      grouped[k].forEach(s => {
        const o = document.createElement('option');
        o.value = s.id; o.textContent = `${s.number ? s.number+'. ':''}${s.name}`;
        og.appendChild(o);
      });
      sel.appendChild(og);
    });
  } catch(e){ alert(e.message); }
}

async function loadStudent() {
  const sid = document.getElementById('selStudent').value;
  curFormId = null;  // เปลี่ยนนักเรียน = ฟอร์มใหม่
  updateFormInfo();
  if (!sid) { curData = null; render(); return; }
  try {
    curData = await apiFetch(`/api/behavior/${sid}`);
    // เติม dropdown รายการตัดคะแนน (เฉพาะที่หักคะแนน points<0) สำหรับ ปค.4
    const selLog = document.getElementById('selLog');
    selLog.innerHTML = '<option value="">-- ล่าสุด --</option>';
    (curData.logs||[]).filter(l => l.points < 0).forEach(l => {
      const o = document.createElement('option');
      o.value = l.id;
      o.textContent = `${pcDateShort(l.date)} • ${l.reason} (${l.points})`;
      selLog.appendChild(o);
    });
    render();
  } catch(e){ alert(e.message); }
}

function thaiDateLong(iso) {
  if (!iso) return { d:'', m:'', y:'' };
  const dt = new Date(iso + 'T00:00:00');
  return { d: dt.getDate(), m: THAI_MONTHS_F[dt.getMonth()], y: dt.getFullYear()+543 };
}
const THAI_MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function pcDateShort(iso){
  if(!iso) return '-';
  const dt = new Date(iso+'T00:00:00');
  return `${dt.getDate()} ${THAI_MONTHS_S[dt.getMonth()]} ${dt.getFullYear()+543}`;
}
// ช่องวันที่ในตาราง ปค.5 แคบ → ปี 2 หลัก เช่น 12 ก.ย. 69
function pcDateTiny(iso){
  if(!iso) return '';
  const dt = new Date(iso+'T00:00:00');
  return `${dt.getDate()} ${THAI_MONTHS_S[dt.getMonth()]} ${String(dt.getFullYear()+543).slice(-2)}`;
}
function namePrefix(s){
  if (/^(เด็กชาย|เด็กหญิง|นาย|นางสาว|ด\.ช\.|ด\.ญ\.)/.test(s.name||'')) return s.name;
  return s.name || '';
}
// ชื่อสำหรับฟอร์มที่มี (ด.ช./ด.ญ./นาย/นางสาว) นำให้วงเลือก → ตัดคำนำหน้าออก เหลือชื่อ-สกุล
function studentFullName(s){
  let n = s.name || '';
  return n.replace(/^(เด็กชาย|เด็กหญิง|นางสาว|นาย|ด\.ช\.|ด\.ญ\.)\s*/, '').trim();
}

function el(id){ return document.getElementById(id); }
function schoolName(){ return theme.school_name || 'โรงเรียนตะกั่วทุ่งงานทวีวิทยาคม'; }
function directorName(){ return theme.director_name || 'นางสาวปัทมา จีนดี'; }
function directorTitle(){ return theme.director_title || 'ผู้อำนวยการ'; }
// ชื่อ ผอ. แบบในต้นฉบับ: เว้น 2 ช่องระหว่างชื่อกับนามสกุล
function dirName(){ return esc(directorName()).replace(/ +/, '&nbsp; '); }

/* ===== เครื่องมือจัดหน้าให้เหมือน Word =====
   ตำแหน่งทุกบรรทัดวัดจากไฟล์ต้นฉบับ หน่วย pt
   y = เส้นฐานตัวอักษร (baseline) วัดจากขอบบนกระดาษ • x วัดจากขอบซ้ายของพื้นที่พิมพ์ */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lhOf = fs => Math.round(fs * 13.1) / 10;                  // ระยะบรรทัด single ของ Word (16pt → 21pt)
const baseOf = (fs, lh) => (lh - 1.301 * fs) / 2 + 0.844 * fs;  // ขอบบนบรรทัด → เส้นฐาน (เมทริกซ์ TH Sarabun New)

// ช่องกรอก (จุดไข่ปลา) — w = กว้างอย่างน้อยกี่ pt, ไม่ใส่ = ยาวถึงสุดบรรทัด, g = กลุ่มที่ข้อความล้นไปต่อบรรทัดถัดไปได้
function F(val = '', w = null, g = '') {
  const cls = 'f' + (w == null ? ' x' : '');
  const st = w == null ? '' : ` style="min-width:${w}pt"`;
  return `<span class="${cls}"${st}><span class="v" contenteditable="true"${g ? ` data-g="${g}"` : ''}>${esc(val)}</span></span>`;
}
// จุดไข่ปลาเฉย ๆ (เช่น ลงชื่อ.........) — w ไม่ใส่ = ยาวถึงสุดบรรทัด
const D = (w = null) => w == null ? '<span class="d x"></span>' : `<span class="d" style="width:${w}pt"></span>`;
const S = w => `<span class="sp" style="width:${w}pt"></span>`;                 // เว้นระยะ / ย่อหน้า
const lab = (t, w) => `<span class="sp" style="width:${w}pt">${t}</span>`;      // หัวข้อกว้างคงที่ เช่น "เรื่อง"
const E = t => `<span class="e" contenteditable="true">${t}</span>`;           // ข้อความพิมพ์ไว้แล้วแต่แก้ได้
// ข้อความวางตำแหน่ง x คงที่ในบรรทัด (ทำคอลัมน์ลายเซ็น) — c = จัดกลางในความกว้าง w
const cell = (x, html, w = null, c = false) =>
  `<span class="cell${c ? ' c' : ''}" style="left:${x}pt;${w ? `width:${w}pt;` : ''}">${html}</span>`;

// เรียงบรรทัดตามตำแหน่งเส้นฐาน: {y} = จากขอบบนกระดาษ, {dy} = ห่างจากบรรทัดก่อน, {mt} = ห่างจากกล่องก่อน (หลังตาราง)
function lines(list) {
  let bottom = 0, base = 0, out = '';
  for (const l of list) {
    if (l.raw != null) { out += l.raw; bottom = 0; base = 0; continue; }
    const fs = l.fs || 16, lh = l.lh || lhOf(fs), b = baseOf(fs, lh);
    const top = l.y != null ? l.y - b : l.dy != null ? base + l.dy - b : bottom + (l.mt || 0);
    out += `<div class="ln${l.c ? ' ' + l.c : ''}" style="margin-top:${(top - bottom).toFixed(2)}pt;`
         + `${fs !== 16 ? `font-size:${fs}pt;` : ''}line-height:${lh}pt;min-height:${lh}pt;${l.st || ''}">${l.h || ''}</div>`;
    bottom = top + lh; base = top + b;
  }
  return out;
}
// ข้อความลอย (เช่น "ปค 1" มุมขวาบน) x/right วัดจากขอบกระดาษ
function absTxt(pos, y, html, fs = 16, st = '') {
  const lh = lhOf(fs);
  return `<div class="ln" style="position:absolute;${pos};top:${(y - baseOf(fs, lh)).toFixed(2)}pt;`
       + `font-size:${fs}pt;line-height:${lh}pt;min-height:${lh}pt;${st}">${html}</div>`;
}
// รูปกลางแนว cx (pt จากขอบซ้ายกระดาษ)
const absImg = (src, top, h, cx) => src
  ? `<img src="${src}" alt="" style="position:absolute;top:${top}pt;left:${cx}pt;height:${h}pt;transform:translateX(-50%);">` : '';
// ไฟล์โลโก้โรงเรียนมีขอบใสรอบตรา ~14% → ขยายรูปให้ "ตัวตรา" สูง h pt เท่าต้นฉบับ
const logoAt = (top, h, cx) => absImg(theme.school_logo, top - h * 0.097, h * 1.164, cx);
const page = (form, pl, pr, inner, extra = '') =>
  `<div class="doc-page${extra ? ' ' + extra : ''}" data-form="${form}" style="padding-left:${pl}pt;padding-right:${pr}pt;">${inner}</div>`;
const A4W = 595.3;

// ข้อความยาวเกินบรรทัด → ย้ายคำท้ายไปช่องถัดไปในกลุ่มเดียวกัน (ตัดคำไทยด้วย Intl.Segmenter)
function flowFields(root) {
  if (!root) return;
  const groups = {};
  root.querySelectorAll('.v[data-g]').forEach(v => (groups[v.dataset.g] = groups[v.dataset.g] || []).push(v));
  const seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('th', { granularity: 'word' }) : null;
  const split = t => seg ? [...seg.segment(t)].map(x => x.segment) : [...t];
  Object.values(groups).forEach(vs => {
    for (let i = 0; i < vs.length - 1; i++) {
      const ln = vs[i].closest('.ln');
      let guard = 0;
      while (ln.scrollWidth > ln.clientWidth + 1 && vs[i].textContent && guard++ < 400) {
        const parts = split(vs[i].textContent);
        const last = parts.pop();
        vs[i].textContent = parts.join('');
        vs[i + 1].textContent = last + vs[i + 1].textContent;
      }
      vs[i].textContent = vs[i].textContent.replace(/\s+$/, '');
      vs[i + 1].textContent = vs[i + 1].textContent.replace(/^\s+/, '');
    }
  });
}

async function printDoc() {
  if (document.activeElement) document.activeElement.blur();
  flowFields(el('content').querySelector('.doc-page'));
  try {
    await Promise.all(['16pt', 'bold 16pt', 'italic bold 16pt']
      .map(f => document.fonts.load(`${f} THSarabunDoc`, 'กขค')));
    await document.fonts.ready;
  } catch (e) {}
  window.print();
}

// คลิกที่จุดไข่ปลา = เริ่มพิมพ์ในช่องนั้น / ออกจากช่อง = จัดข้อความที่ล้นลงบรรทัดถัดไป
document.addEventListener('mousedown', e => {
  const f = e.target.closest && e.target.closest('.doc-page .f');
  if (!f || e.target !== f) return;
  e.preventDefault();
  const v = f.querySelector('.v');
  v.focus();
  const r = document.createRange(); r.selectNodeContents(v); r.collapse(false);
  const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
});
document.addEventListener('focusout', e => {
  if (e.target.matches && e.target.matches('.doc-page .v[data-g]')) flowFields(e.target.closest('.doc-page'));
});
// วางข้อความ = วางเป็นตัวอักษรล้วน ไม่เอาสี/ฟอนต์จากที่อื่นมาด้วย
document.addEventListener('paste', e => {
  if (!e.target.closest || !e.target.closest('.doc-page [contenteditable]')) return;
  e.preventDefault();
  const t = (e.clipboardData || window.clipboardData).getData('text').replace(/\s*\n\s*/g, ' ');
  document.execCommand('insertText', false, t);
});
document.addEventListener('keydown', e => {   // Enter ในช่องกรอกบรรทัดเดียว = ไม่ขึ้นบรรทัดใหม่
  if (e.key === 'Enter' && e.target.closest && e.target.closest('.doc-page .f, .doc-page .e')) e.preventDefault();
});

function render() {
  const form = el('selForm').value;
  el('logPickWrap').style.display = (form === 'pc4') ? '' : 'none';
  if (!curData) {
    el('content').innerHTML = `<div class="doc-page"><div class="text-center text-muted py-5">
      <i class="bi bi-person-x fs-1 d-block mb-2"></i>กรุณาเลือกนักเรียน</div></div>`;
    el('printBtn').disabled = true;
    return;
  }
  el('content').innerHTML = (form === 'pc1') ? renderPC1()
                          : (form === 'pc3') ? renderPC3()
                          : (form === 'pc4') ? renderPC4()
                          : (form === 'pc7') ? renderPC7()
                          : (form === 'leave') ? renderLeave()
                          : renderPC5();
  flowFields(el('content').querySelector('.doc-page'));
  el('printBtn').disabled = false;
  el('saveBtn').disabled = false;
}

function updateFormInfo() {
  const badge = el('curFormInfo');
  if (curFormId) {
    badge.style.display = '';
    badge.innerHTML = `<i class="bi bi-pencil"></i> กำลังแก้ฟอร์ม #${curFormId}`;
  } else {
    badge.style.display = 'none';
  }
}

/* ===== บันทึก / โหลด / ลบ ฟอร์ม ===== */
async function saveForm() {
  if (!curData) { alert('เลือกนักเรียนก่อน'); return; }
  const form = el('selForm').value;
  // เก็บ HTML ของ doc-page (รวมข้อความที่พิมพ์ในช่อง editable)
  const docPage = el('content').querySelector('.doc-page');
  if (!docPage) { alert('ยังไม่มีเอกสาร'); return; }
  const html = docPage.outerHTML;
  const title = `${form.toUpperCase()} • ${studentFullName(curData.student)}`;

  el('saveBtn').disabled = true;
  el('saveBtn').innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
  try {
    const res = await apiFetch('/api/pc-forms', {
      method: 'POST',
      body: JSON.stringify({
        id: curFormId,
        form_type: form,
        student_id: curData.student.id,
        title,
        payload: { html }
      })
    });
    curFormId = res.id;
    updateFormInfo();
    showToast(res.message || 'บันทึกแล้ว');
  } catch (e) {
    alert('บันทึกไม่สำเร็จ: ' + e.message);
  } finally {
    el('saveBtn').disabled = false;
    el('saveBtn').innerHTML = '<i class="bi bi-save"></i>';
  }
}

async function openSavedList() {

async function loadSavedForm(fid) {
  try {
    const f = await apiFetch(`/api/pc-forms/${fid}`);
    const html = f.payload && f.payload.html;
    if (!html) { alert('ฟอร์มนี้ไม่มีข้อมูล'); return; }
    // set dropdowns ให้ตรง (เพื่อ save ทับได้ถูก type/นักเรียน)
    el('selForm').value = f.form_type;
    el('selStudent').value = f.student_id;
    el('logPickWrap').style.display = (f.form_type === 'pc4') ? '' : 'none';
    // โหลด curData ของนักเรียน (เพื่อ save ต่อได้)
    try { curData = await apiFetch(`/api/behavior/${f.student_id}`); } catch(e){}
    curFormId = fid;
    el('content').innerHTML = html;
    // ฟอร์มที่บันทึกก่อนปรับแบบใหม่ ใช้หน้าตาแบบเดิม
    const dp = el('content').querySelector('.doc-page');
    if (dp && !dp.querySelector('.ln')) dp.classList.add('legacy');
    el('printBtn').disabled = false;
    el('saveBtn').disabled = false;
    updateFormInfo();
    if (savedModal) savedModal.hide();
    showToast('โหลดฟอร์มแล้ว — แก้ไขแล้วกดบันทึกเพื่ออัพเดท');
  } catch (e) {
    alert('โหลดไม่สำเร็จ: ' + e.message);
  }
}

async function deleteSavedForm(fid, btn) {
  if (!confirm('ลบฟอร์มนี้ออกจากระบบ?')) return;
  try {
    await apiFetch(`/api/pc-forms/${fid}`, { method: 'DELETE' });
    btn.closest('.d-flex').remove();
    if (curFormId === fid) { curFormId = null; updateFormInfo(); }
    showToast('ลบแล้ว');
  } catch (e) { alert(e.message); }
}

function fmtDateTime(s) {
  if (!s) return '';
  const dt = new Date(s.replace(' ', 'T'));
  if (isNaN(dt)) return s;
  return `${dt.getDate()} ${THAI_MONTHS_F[dt.getMonth()].slice(0,3)} ${dt.getFullYear()+543} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function showToast(msg) {
  // ใช้ alert ง่ายๆ ถ้าไม่มี toast system
  const t = document.createElement('div');
  t.className = 'position-fixed bottom-0 end-0 m-3 alert alert-success shadow';
  t.style.zIndex = 9999;
  t.innerHTML = `<i class="bi bi-check-circle me-1"></i>${msg}`;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

function todayLocalISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
